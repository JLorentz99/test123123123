name: Bug report
description: Report a reproducible problem in code, workflow, or documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach sensitive data, credentials, or controlled-access files.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe example, command, or configuration.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and relevant Python, R, and tool versions.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add safe logs or context. Remove identifiers and secrets.
